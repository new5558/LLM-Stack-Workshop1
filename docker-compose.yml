services:
  chatbot:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    command: streamlit run scripts/task_1_chatbot.py --server.port 8501 --server.address 0.0.0.0

  extractor:
    build: .
    volumes:
      - .:/app
    command: python scripts/task_2_structure_output.py
